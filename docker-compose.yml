services:
  postgres:
    image: postgres:16-alpine
    container_name: specdb-postgres
    environment:
      POSTGRES_DB: specdb
      POSTGRES_USER: specdb
      POSTGRES_PASSWORD: specdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    container_name: specdb-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: specdb-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
