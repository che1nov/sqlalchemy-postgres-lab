name: Docker build and backup restore

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: specdb
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax and Compose
        run: |
          sh -n scripts/backup_postgres.sh
          sh -n scripts/backup_mongodb.sh
          sh -n scripts/test_restore.sh
          docker compose config --quiet
      - name: Build and start databases
        run: |
          docker compose build app
          docker compose up -d --wait postgres mongodb redis
      - name: Run application and seed MongoDB
        run: |
          docker compose run --rm app
          docker compose run --rm app python mongo_orders.py
      - name: Run all integration tests inside application image
        run: docker compose run --rm app python -m unittest -v test_crud_users test_orm test_mongo_orders test_redis_lab
      - name: Back up and restore into temporary databases
        run: |
          pg_archive=$(./scripts/backup_postgres.sh)
          mongo_archive=$(./scripts/backup_mongodb.sh)
          ./scripts/test_restore.sh "$pg_archive" "$mongo_archive"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove temporary CI environment
        if: always()
        run: docker compose down -v
